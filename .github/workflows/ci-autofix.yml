name: CI Autofix

# Deterministic auto-remediation tier (the rubric's "deterministic work → a bot,
# not an LLM"). On any PR, fix ruff-autofixable lint/format issues in the cloud
# and push the fix back to the PR branch. No model involved.
#
# Runs on a CLEAN cloud checkout of committed code — it never sees anyone's local
# uncommitted WIP, so it cannot clobber a parallel working tree; it only adds a
# reviewable style commit to pull.
#
# Loop-safe: commits pushed with GITHUB_TOKEN do NOT re-trigger workflows (GitHub
# loop-prevention), so this cannot fight itself. Trade-off: the CI gate won't
# auto-re-run after the bot commit — re-run it (or push) to confirm green.
#
# Judgment fixes (failing tests, non-autofixable lint, logic) are NOT handled here
# — those go through on-demand `@claude` so a human stays in the merge gate.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ci-autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ruff-autofix:
    # Same-repo PRs only — forks don't get a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff (same version the gate uses)
        run: pip install -e ".[dev]"

      - name: Ruff auto-fix + format
        run: |
          ruff check --fix . || true
          ruff format . || true

      - name: Commit + push fixes if any
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No ruff-fixable changes — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: ruff auto-fix (deterministic CI autofix tier)"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "Pushed ruff auto-fixes to ${{ github.head_ref }} — re-run CI to confirm green."
