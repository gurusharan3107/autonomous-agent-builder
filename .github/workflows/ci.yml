name: CI

# The cloud wall behind the local .githooks/pre-commit fence.
# Catches the recurring "behavioral change without test update" pattern by
# running the real suite on every PR + push to the default branch — enforced
# regardless of local discipline (hooks are bypassable with --no-verify).

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (the test-failure wall)
        run: pytest
