# Local OTEL collector for autoresearch loop runs.
#
# OPTIONAL. The harness primarily relies on OTEL_LOG_RAW_API_BODIES=file:<dir>
# (per SDK-OBSERVABILITY.md) for Path A context-ledger attribution. Jaeger is
# convenience UI for inspecting traces and confirming SDK telemetry health.
#
# Bring up before a loop session:
#   docker compose -f scripts/autoresearch/docker-compose.yml up -d
# Health check:
#   curl http://127.0.0.1:16686    # Jaeger UI
#   curl http://127.0.0.1:4318/v1/traces  # OTLP HTTP receiver (returns 4xx with no body — OK)
# Tear down:
#   docker compose -f scripts/autoresearch/docker-compose.yml down

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: autoresearch-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped
