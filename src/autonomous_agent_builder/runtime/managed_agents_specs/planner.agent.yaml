# Managed Agents config for builder's `planner` role.
#
# Source of truth is agents/definitions.py::AGENT_DEFINITIONS["planner"];
# this YAML is derived from it. Do not edit values that diverge from the
# AgentDefinition without updating the source first — the setup helper
# validates these against the in-code definition before applying.
#
# Phase A: minimal viable agent — system prompt is the planner's
# prompt_template prefix (without per-task interpolation), tools are
# limited to read-only filesystem + the host-side custom tool for
# builder memory. Phase B will provision all 11 roles with full templates
# and multiagent rosters.
#
# Apply with: `builder agent runtime managed-agents setup`
name: builder-planner
description: |
  Builder's planner role on the Managed Agents lane. Breaks features
  into implementation tasks with dependencies, acceptance criteria, and
  parallel-execution hints. Mirrors AGENT_DEFINITIONS['planner'].
model: claude-opus-4-7
system: |
  You are a sprint planning expert for software projects.

  Given a feature description and codebase context, produce a task
  breakdown:
  - Each task has: title, description, acceptance criteria, estimated
    complexity
  - Identify dependencies between tasks
  - Order tasks for optimal parallel execution
  - Flag tasks that need design review first

  Analyze the codebase using read/glob/grep to understand the current
  structure before planning. Use the `builder_memory_search` tool to
  consult precedent from prior planning decisions when relevant.

  If you cannot continue without an operator decision, emit
  `OPERATOR_DECISION_JSON:` followed immediately by one raw JSON object
  and nothing else after that object. Use this shape:

  {
    "phase": "planning",
    "summary": "<brief why planning is blocked>",
    "question": "<exact operator decision needed>",
    "options": ["<option 1>", "<option 2>"],
    "recommended_option": "<one option or empty>"
  }
tools:
  # Pre-built Claude Agent toolset — read-only filesystem operations.
  # Bash and Write are intentionally not enabled for planner: it inspects
  # the repo and produces a task list, never mutates code.
  - type: agent_toolset_20260401
    default_config:
      enabled: false
    configs:
      - name: read
        enabled: true
      - name: glob
        enabled: true
      - name: grep
        enabled: true
      - name: web_fetch
        enabled: true
      - name: web_search
        enabled: true
  # Host-side custom tool — returns precedent from `.memory/` filesystem
  # via the orchestrator (NOT a Memory Store; preserves filesystem
  # contract per the approved plan).
  - type: custom
    name: builder_memory_search
    description: |
      Search builder memory (decisions, patterns, corrections) on the
      host filesystem for precedent relevant to the current planning
      task. Returns matching memory entries as JSON.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Free-text search query (required).
        tags:
          type: string
          description: Optional comma-separated tag filter.
        limit:
          type: integer
          description: Max results (default 10, max 100).
      required:
        - query
metadata:
  builder_role: planner
  builder_source: agents/definitions.py
