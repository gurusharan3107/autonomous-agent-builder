# Managed Agents environment template — single template shared by all
# builder agent sessions on the claude_managed lane.
#
# `cloud` is the only currently-supported environment type per the
# Managed Agents docs. Networking allows package managers + the hosts
# builder agents need: Anthropic API (for inter-session calls if ever
# needed), GitHub (for cloned repo + GitHub MCP), npm/PyPI (for
# build_verify subprocess installs).
#
# Apply with: `builder agent runtime managed-agents setup`
name: builder-default
description: |
  Default cloud environment for builder claude_managed sessions. Allows
  package-manager egress + GitHub + Anthropic API; everything else
  blocked at the network layer.
config:
  type: cloud
  networking:
    type: package_managers_and_custom
    allowed_hosts:
      - api.anthropic.com
      - mcp.notion.com
      - api.githubcopilot.com
      - api.github.com
      - github.com
      - raw.githubusercontent.com
metadata:
  builder_managed: "true"
